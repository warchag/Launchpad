name: Build Launchpad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build and Package Launchpad.app
      run: |
        chmod +x ./package_app.sh
        ./package_app.sh

    - name: Upload Launchpad.zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Launchpad-macOS
        path: Launchpad.zip
